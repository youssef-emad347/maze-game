<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متاهة الهدف</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Tahoma, Arial, sans-serif;
        background: #fff;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* الماب تاخد أكبر مساحة ممكنة */
      #mazeWrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        padding: 0;
        margin: 0;
        background: none;
        box-shadow: none;
        border-radius: 0;
        overflow: hidden;
      }

      canvas#maze {
        display: block;

        /* الماب كبيرة وتملأ الشاشة */
        width: 100%;
        height: 100%;

        /* تحافظ على شكل الماب */
        object-fit: contain;

        border-radius: 0;
        touch-action: none;
      }

      /* نخفي الـstatus */
      #status {
        display: none;
      }

      /* أزرار الحركة فوق الماب */
      #controls {
        position: absolute;
        right: 25px;
        bottom: 25px;

        display: grid;
        grid-template-columns: 52px 52px 52px;
        grid-template-rows: 52px 52px 52px;
        gap: 5px;

        z-index: 20;
        user-select: none;
      }

      .arrow {
        width: 52px;
        height: 52px;

        background: rgba(255, 255, 255, 0.85);
        border: 2px solid rgba(80, 55, 30, 0.8);
        border-radius: 12px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 25px;
        color: #5b3b20;

        cursor: pointer;

        box-shadow: 0 3px 0 rgba(80, 55, 30, 0.7);

        touch-action: manipulation;
        -webkit-user-select: none;
      }

      .arrow:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 rgba(80, 55, 30, 0.7);
        background: rgba(255, 255, 255, 0.95);
      }

      .up {
        grid-column: 2;
        grid-row: 1;
      }

      .left {
        grid-column: 1;
        grid-row: 2;
      }

      .right {
        grid-column: 3;
        grid-row: 2;
      }

      .down {
        grid-column: 2;
        grid-row: 3;
      }

      /* شاشة الفوز */
      #winOverlay {
        position: absolute;
        inset: 0;

        background: rgba(0, 0, 0, 0.45);

        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;

        gap: 15px;
        color: white;
        text-align: center;

        z-index: 30;
      }

      #winOverlay.show {
        display: flex;
      }

      #winOverlay h2 {
        margin: 0;
        font-size: clamp(25px, 5vw, 40px);
        text-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
      }

      .btn {
        background: #ffd15c;
        border: 2px solid #9b6500;
        color: #4a2a05;

        font-weight: bold;
        font-size: 16px;

        padding: 10px 22px;
        border-radius: 10px;

        cursor: pointer;
        box-shadow: 0 3px 0 #9b6500;
      }

      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 #9b6500;
      }

      /* الموبايل */
      @media (max-width: 600px) {
        #controls {
          right: 12px;
          bottom: 12px;

          grid-template-columns: 46px 46px 46px;
          grid-template-rows: 46px 46px 46px;
        }

        .arrow {
          width: 46px;
          height: 46px;
          font-size: 21px;
        }
      }
    </style>
  </head>
  <body>
    <div id="status">استخدم الأسهم لتحريك اللاعب حتى تصل لكلمة "goal" 🏁</div>

    <div id="mazeWrap" dir="ltr">
      <canvas id="maze"></canvas>
      <div id="winOverlay">
        <h2>🎉 برافو! وصلت للهدف 🎉</h2>
      </div>
    </div>

    <div id="bottomRow">
      <div id="controls" dir="ltr">
        <button class="arrow up" id="btnUp">⬆️</button>
        <button class="arrow left" id="btnLeft">⬅️</button>
        <button class="arrow right" id="btnRight">➡️</button>
        <button class="arrow down" id="btnDown">⬇️</button>
      </div>
    </div>

      const bgImg = new Image();
      const maskImg = new Image();
      const playerImg = new Image();
      const goalImg = new Image();

      bgImg.src = BG_SRC;
      maskImg.src = MASK_SRC;
      playerImg.src = PLAYER_SRC;
      goalImg.src = GOAL_SRC;

      const W = 1100,
        H = 733;
      const START = { x: 609, y: 609 };
      const GOAL = { x: 170, y: 148 };
      const GOAL_RADIUS = 42;
      const PLAYER_SPEED = 3.6;
      const FOOT_HALFWIDTH = 14;

      const canvas = document.getElementById("maze");
      const ctx = canvas.getContext("2d");
      canvas.width = W;
      canvas.height = H;

      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = W;
      maskCanvas.height = H;
      const maskCtx = maskCanvas.getContext("2d");
      let maskData = null;

      let player = { x: START.x, y: START.y };
      let goal = { x: 170, y: 148 };
      let won = false;
      let imagesReady = 0;

      function imgReady() {
        imagesReady++;
        if (imagesReady === 3) {
          maskCtx.drawImage(maskImg, 0, 0, W, H);
          maskData = maskCtx.getImageData(0, 0, W, H).data;
          requestAnimationFrame(loop);
        }
      }
      bgImg.onload = imgReady;
      maskImg.onload = imgReady;
      playerImg.onload = imgReady;
      goalImg.onload = imgReady;

      function isWalkable(x, y) {
        if (x < 0 || x >= W || y < 0 || y >= H) return false;
        const idx = (Math.floor(y) * W + Math.floor(x)) * 4;
        return maskData[idx] > 128;
      }

      function canStandAt(x, y) {
        // sample a small footprint around feet point
        const pts = [
          [x, y],
          [x - FOOT_HALFWIDTH, y],
          [x + FOOT_HALFWIDTH, y],
          [x, y - 6],
        ];
        for (const [px, py] of pts) {
          if (!isWalkable(px, py)) return false;
        }
        return true;
      }

      const keys = {};
      window.addEventListener("keydown", (e) => {
        const map = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
          w: "up",
          s: "down",
          a: "left",
          d: "right",
        };
        if (map[e.key]) {
          keys[map[e.key]] = true;
          e.preventDefault();
        }
      });
      window.addEventListener("keyup", (e) => {
        const map = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
          w: "up",
          s: "down",
          a: "left",
          d: "right",
        };
        if (map[e.key]) {
          keys[map[e.key]] = false;
        }
      });

      function bindHold(el, dir) {
        const set = (v) => (e) => {
          keys[dir] = v;
          if (e) e.preventDefault();
        };
        el.addEventListener("mousedown", set(true));
        el.addEventListener("mouseup", set(false));
        el.addEventListener("mouseleave", set(false));
        el.addEventListener("touchstart", set(true), { passive: false });
        el.addEventListener("touchend", set(false));
        el.addEventListener("touchcancel", set(false));
      }
      bindHold(document.getElementById("btnUp"), "up");
      bindHold(document.getElementById("btnDown"), "down");
      bindHold(document.getElementById("btnLeft"), "left");
      bindHold(document.getElementById("btnRight"), "right");

      let facing = 1; // 1 right, -1 left

      function update() {
        if (won) return;
        let dx = 0,
          dy = 0;
        if (keys.up) dy -= 1;
        if (keys.down) dy += 1;
        if (keys.left) dx -= 1;
        if (keys.right) dx += 1;
        if (dx === 0 && dy === 0) return;
        const len = Math.hypot(dx, dy) || 1;
        dx = (dx / len) * PLAYER_SPEED;
        dy = (dy / len) * PLAYER_SPEED;

        if (dx !== 0) {
          if (dx > 0) facing = 1;
          else facing = -1;
          const nx = player.x + dx;
          if (canStandAt(nx, player.y)) player.x = nx;
        }
        if (dy !== 0) {
          const ny = player.y + dy;
          if (canStandAt(player.x, ny)) player.y = ny;
        }

        const dist = Math.hypot(player.x - GOAL.x, player.y - GOAL.y);
        if (dist < GOAL_RADIUS) {
          won = true;
          document.getElementById("winOverlay").classList.add("show");
          document.getElementById("status").textContent = "وصلت للهدف! 🎉";
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(bgImg, 0, 0, W, H);

        const h = 92;
        const w = h * (playerImg.naturalWidth / playerImg.naturalHeight);
        ctx.save();
        ctx.translate(player.x, player.y);
        if (facing < 0) ctx.scale(-1, 1);
        ctx.drawImage(playerImg, -w / 2, -h + 8, w, h);
        ctx.restore();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      function newGame() {
        player = { x: START.x, y: START.y };
        goal = { x: 170, y: 148 };

        won = false;
        facing = 1;
        document.getElementById("winOverlay").classList.remove("show");
        document.getElementById("status").textContent =
          'استخدم الأسهم لتحريك اللاعب حتى تصل لكلمة "goal" 🏁';
      }
    </script>
